gate2_metrics:
  - unit_count
  - unit_area_distribution
  - poi_sparsity
  - population_sparsity
  - road_sparsity
  - semantic_mixing
  - within_unit_location_loss
  - neighborhood_representation_error
  - boundary_origin_sensitivity
  - maup_stability
  - computation_wall_time
  - peak_rss
  - storage_bytes
  - latlon_lookup_latency

gate2_acceptance:
