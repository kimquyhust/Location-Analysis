gate2_metrics:
  - unit_count
  - unit_area_distribution
  - poi_sparsity
  - population_sparsity
  - road_sparsity
  - semantic_mixing
  - within_unit_location_loss
  - neighborhood_representation_error
  - boundary_origin_sensitivity
  - maup_stability
  - computation_wall_time
  - peak_rss
  - storage_bytes
  - latlon_lookup_latency

gate2_acceptance:
  minimum_raster_processing_coverage: 0.999
  coarse_within_unit_range_fraction_of_between_unit_iqr: 0.25
  coarse_minimum_anchor_features_triggered: 2
  fine_cost_multiplier_vs_next_coarser: 2.0
  fine_minimum_error_improvement: 0.05
  fine_maximum_indistinguishable_neighbor_fraction: 0.80
  selection: pareto_nondominated_then_lowest_cost_then_lookup_simplicity

output_crs:
  storage: EPSG:4326
  metric_operations: local_utm_or_equal_area_selected_per_aoi
