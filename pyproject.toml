[project]
name = "location-feature-vector"
version = "0.1.0"
description = "Reusable location feature layer for Vietnam"
requires-python = ">=3.11"

dependencies = [
  "pandas>=2.2",
  "pyarrow>=17",
  "geopandas>=1.0",
  "shapely>=2.0",
  "duckdb>=1.1",
  "h3>=4.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jupyter>=1.0",
  "matplotlib>=3.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
